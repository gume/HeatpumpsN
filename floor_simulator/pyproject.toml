[project]
name = "floor-simulator"
version = "0.1.0"
description = "ESP32 floor-heating HIL simulator and web bench"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "paho-mqtt>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "numpy>=1.26", "selenium>=4"]

[tool.uv]
package = false
