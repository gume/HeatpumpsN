# Development InfluxDB for the observer (port 38086, data in ./data/influx).
# docker compose -f docker-compose.dev.yml up -d
services:
  influxdb:
    image: influxdb:2.7
    container_name: observer-influx-dev
    ports:
      - "38086:8086"
    volumes:
      - ./data/influx:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: observer
      DOCKER_INFLUXDB_INIT_PASSWORD: observer-dev-password
      DOCKER_INFLUXDB_INIT_ORG: heatpumpsn
      DOCKER_INFLUXDB_INIT_BUCKET: observer
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: observer-dev-token
    restart: unless-stopped
