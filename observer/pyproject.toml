[project]
name = "observer"
version = "0.5.0"
description = "HeatpumpsN observer: ingests the heating system's MQTT data, stores it raw in InfluxDB, supervises and optimises"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0",
    "influxdb-client>=1.40",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "duckdb>=1.1",                # database export/import files
    "numpy>=1.26",                # identification of the mixer model
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=2.3"]           # `observer mcp`: the agent tools for MCP clients

[project.scripts]
observer = "observer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["observer*"]

[tool.setuptools.package-data]
observer = ["static/*", "defaults/*", "defaults/.*", "sandbox_lib/*/*", "sim/*.json", "sim/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
