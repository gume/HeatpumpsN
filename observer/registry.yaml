# Which signals the observer stores and what they mean.
#
# signals: exact signal ids (MQTT topic, or topic#json.path for JSON fields).
# rules:   glob patterns giving families the same description; the first
#          matching rule gives the defaults, an exact entry adds to them.
# Fields:  name, quantity, unit, location, circuit, role, description, store.
# Circuits: floor = BF floor heating (pump 3, mixer); rad1 = MF radiators
# (pump 1); rad2 = TF radiators (pump 2). Floors: TF top, MF middle, BF bottom.
#
# Edit by hand, or let `observer propose` + `observer accept` add entries.

store_unregistered: false

rules:
  # Room sensors from Home Assistant (MQTT Statestream).
  - match: "ha_state/sensor/temperature_humidity_sensor_*_temperature/state"
    quantity: temperature
    unit: "°C"
    role: room
  - match: "ha_state/sensor/temperature_humidity_sensor_*_humidity/state"
    quantity: humidity
    unit: "%"
    role: room
  - match: "ha_state/sensor/bth01_*_temperature/state"
    quantity: temperature
    unit: "°C"
    role: room
  - match: "ha_state/sensor/bth01_*_humidity/state"
    quantity: humidity
    unit: "%"
    role: room
  - match: "ha_state/sensor/*_battery_plus/state"
    store: false
    description: Duplicate of the sensor's battery percentage.
  - match: "ha_state/sensor/*_voltage/state"
    quantity: other
    unit: V
    role: diagnostic
    description: Sensor battery voltage.
  - match: "ha_state/sensor/*_battery/state"
    quantity: battery
    unit: "%"
    role: diagnostic
  # EMS-ESP boiler fields: units and meaning by name (EMS-ESP's HA discovery is
  # off, so the stream carries no units). Specific patterns come first.
  - match: "ems-esp/boiler_data#*settemp*"
    quantity: setpoint
    unit: "°C"
    role: dhw
  - match: "ems-esp/boiler_data#dhw.*temp*"
    quantity: temperature
    unit: "°C"
    role: dhw
  - match: "ems-esp/boiler_data#*temp*"
    quantity: temperature
    unit: "°C"
    role: boiler
  - match: "ems-esp/boiler_data#*starts"
    quantity: counter
    role: burner
    description: Start counter (rises by one per start; the rate shows short-cycling).
  - match: "ems-esp/boiler_data#*workmin"
    quantity: duration
    unit: min
    role: burner
    description: Operating-time counter in minutes.
  - match: "ems-esp/boiler_data#dhw.workm"
    quantity: duration
    unit: min
    role: dhw
    description: DHW operating-time counter in minutes.
  - match: "ems-esp/boiler_data#*pow"
    quantity: modulation
    unit: "%"
    role: burner
  - match: "ems-esp/boiler_data#*pumpmod"
    quantity: modulation
    unit: "%"
    role: pump
  - match: "ems-esp/boiler_data#dhw.curflow"
    quantity: other
    unit: l/min
    role: dhw
    description: DHW (tap water) flow.
  - match: "ems-esp/boiler_data#dhw.*"
    quantity: state
    role: dhw
  # Controller internals: configuration and duplicates are not stored.
  - match: "heatpumpsn/controller/state/mpc/params/*"
    store: false
    role: controller
    description: MPC parameter set (configuration; changes only when a set is pushed).
  - match: "heatpumpsn/controller/log/slow*"
    store: false
    role: controller
    description: Slow log sample (repeats the state topics that are stored anyway).
  - match: "heatpumpsn/controller/log/event*"
    role: diagnostic
    description: Controller event log record (code, severity, detail).
  - match: "heatpumpsn/controller/state/mpc#*"
    role: controller
    description: Predictive mixer controller status (every 5 s).
  - match: "heatpumpsn/controller/state/*_physical"
    quantity: state
    role: pump
  - match: "heatpumpsn/controller/state/heating_loop_*"
    quantity: state
    role: controller
    description: Effective heating demand of the circuit from Home Assistant (after keep-alive).
  - match: "heatpumpsn/controller/state/floor_heating"
    quantity: state
    role: controller
    description: Effective floor heating demand from Home Assistant (after keep-alive).
  - match: "heatpumpsn/controller/state/power_*"
    quantity: power
    unit: W
    role: pump
  - match: "heatpumpsn/controller/state/wifi_*"
    role: diagnostic
  # EMS-ESP repeats each DS18B20 address as a "name" text field: noise.
  - match: "ems-esp/temperaturesensor_data#*.name"
    store: false
    description: Repeats the sensor address.
  # Everything else the boiler reports: stored raw, described when needed.
  - match: "ems-esp/boiler_data#*"
    role: boiler
  - match: "ems-esp/heartbeat#*"
    role: diagnostic
    description: EMS-ESP health counters (bus, MQTT, Wi-Fi, memory).
  # The controller: everything it publishes (states, MPC status, logs).
  - match: "heatpumpsn/controller/*"
    role: controller
  # MixerMeter encoder on the floor mixer valve.
  - match: "mixermeter/sensor/*/state"
    circuit: floor
    role: valve

signals:
  # --- Circuit forward/return at the distribution (EMS-ESP DS18B20) ---------
  "ems-esp/temperaturesensor_data#28_FF64_1E9F_9836.temp":
    name: BF fwd
    quantity: temperature
    unit: "°C"
    location: BF
    circuit: floor
    role: supply
    description: Floor heating (bottom floor) forward temperature after the mixer, EMS-ESP DS18B20.
  "ems-esp/temperaturesensor_data#28_FF64_1E93_BE20.temp":
    name: BF back
    quantity: temperature
    unit: "°C"
    location: BF
    circuit: floor
    role: return
    description: Floor heating (bottom floor) return temperature, EMS-ESP DS18B20.
  "ems-esp/temperaturesensor_data#28_FF64_1E93_AA77.temp":
    name: MF fwd
    quantity: temperature
    unit: "°C"
    location: MF
    circuit: rad1
    role: supply
    description: Middle-floor radiator circuit (pump 1) forward temperature, EMS-ESP DS18B20.
  "ems-esp/temperaturesensor_data#28_FF64_1E9F_CF23.temp":
    name: MF back
    quantity: temperature
    unit: "°C"
    location: MF
    circuit: rad1
    role: return
    description: Middle-floor radiator circuit (pump 1) return temperature, EMS-ESP DS18B20.
  "ems-esp/temperaturesensor_data#28_FF64_1E9D_DFFF.temp":
    name: TF fwd
    quantity: temperature
    unit: "°C"
    location: TF
    circuit: rad2
    role: supply
    description: Top-floor radiator circuit (pump 2) forward temperature, EMS-ESP DS18B20.
  "ems-esp/temperaturesensor_data#28_FF64_1E93_A6E3.temp":
    name: TF back
    quantity: temperature
    unit: "°C"
    location: TF
    circuit: rad2
    role: return
    description: Top-floor radiator circuit (pump 2) return temperature, EMS-ESP DS18B20.

  # --- Boiler (EMS-ESP) ------------------------------------------------------
  "ems-esp/boiler_data#curflowtemp":
    name: Boiler flow
    quantity: temperature
    unit: "°C"
    role: boiler
    description: Boiler flow (supply) temperature measured by the boiler.
  "ems-esp/boiler_data#selflowtemp":
    name: Boiler flow setpoint
    quantity: setpoint
    unit: °C
    role: boiler
    store: false
  "ems-esp/boiler_data#curburnpow":
    name: Burner power
    quantity: modulation
    unit: "%"
    role: burner
  "ems-esp/boiler_data#burnstarts":
    name: Burner starts
    quantity: counter
    role: burner
    description: Burner start counter (short-cycling indicator).
  "ems-esp/boiler_data#heatingactive":
    name: Heating active
    quantity: state
    role: boiler
  "ems-esp/boiler_data#tapwateractive":
    name: Tap water active
    quantity: state
    role: dhw
  "ems-esp/boiler_data#dhw.curtemp":
    name: DHW tank
    quantity: temperature
    unit: "°C"
    role: dhw
  "ems-esp/boiler_data#dhw.charging":
    name: DHW charging
    quantity: state
    role: dhw
  "ems-esp/status":
    name: EMS-ESP online
    quantity: status
    role: diagnostic
    description: EMS-ESP MQTT availability (its last will publishes offline).

  # --- Controller (HeatpumpsN) -----------------------------------------------
  "heatpumpsn/controller/state/temp_boiler":
    name: Controller boiler supply
    quantity: temperature
    unit: "°C"
    role: boiler
    description: Boiler supply temperature at the distribution, measured by the controller.
  "heatpumpsn/controller/state/temp_mix":
    name: Controller floor forward
    quantity: temperature
    unit: "°C"
    location: BF
    circuit: floor
    role: supply
  "heatpumpsn/controller/state/temp_return":
    name: Controller floor return
    quantity: temperature
    unit: "°C"
    location: BF
    circuit: floor
    role: return
  "heatpumpsn/controller/state/floor_setpoint":
    name: Floor setpoint
    quantity: setpoint
    unit: "°C"
    location: BF
    circuit: floor
    role: controller
  "heatpumpsn/controller/state/mixer_position":
    name: Mixer position
    quantity: position
    unit: "%"
    location: BF
    circuit: floor
    role: valve
    description: Floor mixer opening, dead-reckoned by the controller.
  "heatpumpsn/controller/state/pump_1_physical":
    name: Pump MF
    quantity: state
    location: MF
    circuit: rad1
    role: pump
  "heatpumpsn/controller/state/pump_2_physical":
    name: Pump TF
    quantity: state
    location: TF
    circuit: rad2
    role: pump
  "heatpumpsn/controller/state/floor_pump_physical":
    name: Pump BF
    quantity: state
    location: BF
    circuit: floor
    role: pump
  "heatpumpsn/controller/state/heater_physical":
    name: Heat call
    quantity: state
    role: boiler
    description: The controller's heat call to the boiler (relay state).
  "heatpumpsn/controller/status":
    name: Controller online
    quantity: status
    role: diagnostic

  # --- MixerMeter -------------------------------------------------------------
  "mixermeter/sensor/mixer_value/state":
    name: Mixer encoder
    quantity: position
    location: BF
    circuit: floor
    role: valve
    description: Floor mixer position from the independent BMI160 encoder.
  "mixermeter/sensor/angle/state":
    name: Mixer encoder angle
    quantity: angle
    unit: "°"
    location: BF
    circuit: floor
    role: valve

  # --- Outdoor (Home Assistant, OpenWeatherMap, via Statestream) -------------
  "ha_state/sensor/owm_korona_temperature/state":
    name: Outdoor
    quantity: temperature
    unit: "°C"
    location: outdoor
    role: outdoor
    description: Outdoor air temperature from OpenWeatherMap for the house's location (HA "owm_korona"; not the feels-like value).
  "ha_state/sensor/owm_korona_humidity/state":
    name: Outdoor humidity
    quantity: humidity
    unit: "%"
    location: outdoor
    role: outdoor
    description: Outdoor relative humidity from OpenWeatherMap (HA "owm_korona").

  # --- Rooms (Home Assistant, via Statestream) --------------------------------
  "ha_state/sensor/temperature_humidity_sensor_50da_temperature/state": {name: Attic, location: attic}
  "ha_state/sensor/temperature_humidity_sensor_2a38_temperature/state": {name: David, location: TF}
  "ha_state/sensor/temperature_humidity_sensor_a3ec_temperature/state": {name: AA, location: TF}
  "ha_state/sensor/temperature_humidity_sensor_9afa_temperature/state": {name: Bathroom TF, location: TF}
  "ha_state/sensor/temperature_humidity_sensor_a6ce_temperature/state": {name: Marcell, location: MF}
  "ha_state/sensor/temperature_humidity_sensor_adcb_temperature/state": {name: Kitchen, location: MF}
  "ha_state/sensor/temperature_humidity_sensor_6596_temperature/state": {name: Sport, location: MF}
  "ha_state/sensor/temperature_humidity_sensor_169d_temperature/state": {name: Bathroom MF, location: MF}
  "ha_state/sensor/temperature_humidity_sensor_e9ad_temperature/state": {name: Dining room, location: BF}
  "ha_state/sensor/temperature_humidity_sensor_d281_temperature/state": {name: Lab, location: BF}
  "ha_state/sensor/bth01_f4fe_temperature/state": {name: Boiler room, location: BF}
  "ha_state/sensor/bth01_1223_temperature/state":
    name: Bathroom BF
    quantity: temperature
    unit: °C
    location: BF
    role: room
    description: Bathroom temperature on the Base floor
    store: true
  "ha_state/sensor/bth01_6f31_temperature/state": {name: Garage, location: BF}
  ems-esp/boiler_data#dhw.curtemp2:
    quantity: temperature
    unit: °C
    role: dhw
    store: false
  ems-esp/boiler_data#dhw.storagetemp2:
    quantity: temperature
    unit: °C
    role: dhw
    store: false
  ems-esp/boiler_data#dhw.tempok:
    quantity: temperature
    unit: °C
    role: dhw
    store: false
  ems-esp/boiler_data#heatingtemp:
    quantity: temperature
    unit: °C
    role: boiler
    store: false
  ems-esp/boiler_data#pumpontemp:
    quantity: temperature
    unit: °C
    role: boiler
    store: false
