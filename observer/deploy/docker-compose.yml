# HeatpumpsN observer, release: InfluxDB, the data collector and the portal.
#
# CODE LAND. This file belongs to the release (app/deploy/docker-compose.yml);
# the install folder links to it and every update replaces it. Do not edit
# it: your own additions go into docker-compose.override.yml (compose reads it
# automatically), your settings into .env.
#
#   <install folder>/                  e.g. ~/heatpumpsn-observer
#     .env                             YOURS: passwords, tokens, broker, ports
#     data/                            YOURS: everything the observer keeps (/data in
#                                      the containers): config.yaml, registry.yaml,
#                                      checks.yaml, house/, library/, data/, runs/, exports/
#     docker-compose.override.yml      YOURS (optional)
#     app/                             CODE: the release, replaced by every update
#     docker-compose.yml          -> app/deploy/docker-compose.yml
#     docker-compose.sandbox.yml  -> app/deploy/docker-compose.sandbox.yml
#
# The recorded samples stay in InfluxDB's named volume heatpumpsn-observer_influx-data.
#
#   app/scripts/update.sh <bundle.tar.gz>   install or update (keeps .env and data/)
#   app/scripts/cleanup.sh [--yes]          lists (and with --yes deletes) what is surely not needed
#
# The collector has its own image and version: an update that does not change
# it leaves the running collector alone (no gap in the recording).
name: heatpumpsn-observer

services:
  influxdb:
    image: influxdb:2.7.12
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup          # only on the very first start (empty volume)
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-observer}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?set INFLUX_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-heatpumpsn}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-observer}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:?set INFLUX_ADMIN_TOKEN in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    ports:
      - "${INFLUX_BIND:-127.0.0.1}:${INFLUX_PORT:-8086}:8086"   # InfluxDB UI and API (optional)
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  collector:
    build:
      context: ./app
      dockerfile: Dockerfile.collector
      args:                                      # the hash in collector.lock (scripts/collector_lock.py)
        COLLECTOR_DIGEST: "c9a3103fc356030aaa72b0f0c2982a25f552567e70a25787a69c0ef87002cb77"
    image: heatpumpsn-collector:1.0.0             # COLLECTOR_VERSION (observer/collector.py)
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    user: "${OBSERVER_UID:-1000}:${OBSERVER_GID:-1000}"
    # only what the collector needs: other .env changes do not recreate it
    environment:
      INFLUX_TOKEN: ${INFLUX_ADMIN_TOKEN}
      OBSERVER_INFLUX_URL: http://influxdb:8086
      OBSERVER_INFLUX_ORG: ${INFLUX_ORG:-heatpumpsn}
      OBSERVER_INFLUX_BUCKET: ${INFLUX_BUCKET:-observer}
      OBSERVER_MQTT_HOST: ${OBSERVER_MQTT_HOST:-mqtt.home}
      OBSERVER_MQTT_PORT: ${OBSERVER_MQTT_PORT:-1883}
      OBSERVER_MQTT_USER: ${OBSERVER_MQTT_USER:-}
      OBSERVER_MQTT_PASSWORD: ${OBSERVER_MQTT_PASSWORD:-}
      OBSERVER_MQTT_TOPIC_PREFIX: ${OBSERVER_MQTT_TOPIC_PREFIX:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  observer:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: heatpumpsn-observer:0.7.1              # the observer version (pyproject.toml)
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    user: "${OBSERVER_UID:-1000}:${OBSERVER_GID:-1000}"
    env_file: .env                                # every setting, e.g. OBSERVER_LLM_2_BASE_URL, OBSERVER_GITHUB_TOKEN
    environment:
      INFLUX_TOKEN: ${INFLUX_ADMIN_TOKEN}
      OBSERVER_INFLUX_URL: http://influxdb:8086
      OBSERVER_INFLUX_ORG: ${INFLUX_ORG:-heatpumpsn}
      OBSERVER_INFLUX_BUCKET: ${INFLUX_BUCKET:-observer}
      OBSERVER_MQTT_HOST: ${OBSERVER_MQTT_HOST:-mqtt.home}
      OBSERVER_MQTT_PORT: ${OBSERVER_MQTT_PORT:-1883}
      OBSERVER_MQTT_USER: ${OBSERVER_MQTT_USER:-}
      OBSERVER_MQTT_PASSWORD: ${OBSERVER_MQTT_PASSWORD:-}
      OBSERVER_MQTT_TOPIC_PREFIX: ${OBSERVER_MQTT_TOPIC_PREFIX:-}
      OBSERVER_INGEST: external                   # the collector stores the data
      OBSERVER_PORTAL_USER: ${OBSERVER_PORTAL_USER:-admin}
      OBSERVER_PORTAL_PASSWORD: ${OBSERVER_PORTAL_PASSWORD:-}
      OBSERVER_LLM_BASE_URL: ${OBSERVER_LLM_BASE_URL:-}
      OBSERVER_LLM_KEY: ${OBSERVER_LLM_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
    ports:
      - "${OBSERVER_BIND:-127.0.0.1}:${OBSERVER_PORT:-8090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"     # a broker or LLM proxy on the Docker host

volumes:
  influx-data:
  influx-config:
