; =============================================================================
; HeatpumpsN controller firmware — PlatformIO project
;
; Boards:
;   HomeNet Heating control v0.1   74HC595 outputs, analogue current MUX
;   HomeNet Heating control v1.x   PCF8574 outputs, ADS1115 current sensing
;   boardless                      bare devkit, no board
;
; I/O backend: real pins by default, or the emulation model with
; -DHPN_IO_EMULATION. The default environment esp32dev_sim emulates
; HomeNet Heating control v0.1 on a boardless devkit; see
; firmware/docs/io-emulation.md.
;
; The MCU never selects features. Every environment builds the same controller;
; the HPN_CARRIER_* macro picks the board profile (pins, sensors, LEDs) and
; HPN_IO_EMULATION picks the I/O backend. HPN_TARGET_* only describes MCU
; capabilities (core count).
;
; Build:   pio run            (default env: esp32dev_sim)
; Upload:  pio run -t upload
; Monitor: pio device monitor
; =============================================================================

[platformio]
default_envs = esp32dev_sim

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs
; The copy in src/ is what PlatformIO Remote synchronizes. Keep it identical
; to the project-root partitions.csv reference table.
board_build.partitions = src/partitions.csv

build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DCORE_DEBUG_LEVEL=3
  -DHPN_FW_VERSION=\"0.4.0-mpc\"
  ; AsyncTCP subscribes its service task to the ESP task watchdog by default.
  ; The controller's rule is that only T_io feeds the plant watchdog, so a slow
  ; HTTP handler, a large JSON response or a weak Wi-Fi link can never reset
  ; the outputs. Without this flag a long network callback leaves the shared
  ; watchdog entry stale and the whole controller panics with
  ; "task-watchdog". Keep this in every environment.
  -DCONFIG_ASYNC_TCP_USE_WDT=0
  ; ESPAsyncWebServer queues up to 32 WebSocket frames per client by default.
  ; With ~5 KB state frames one stalled browser tab could hold 160 KB, more
  ; than the free heap. Four frames bound it to ~20 KB per client.
  -DWS_MAX_QUEUED_MESSAGES=4

; PlatformIO Remote uploads with the "nobuild" target, which skips the
; platform's checkprogsize/partition parsing and the Arduino framework script.
; The pre/post hooks in src/remote_upload.json (Python SConscript; .json is a
; source extension that PlatformIO Remote syncs) make the partition table
; discoverable and spell out the application offset so esptool accepts the
; call. Extra images (bootloader, partition table, boot_app0) are only added by
; a normal build; a device that was never flashed needs one local upload first.
extra_scripts =
  pre:src/remote_upload.json
  post:src/remote_upload.json

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  knolleary/PubSubClient@^2.8
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit NeoPixel@^1.12.0
  ESP32Async/AsyncTCP@^3.5.0
  ESP32Async/ESPAsyncWebServer@^3.12.1

; --- Boardless devkit, real direct GPIO (no carrier fitted) -----------------
; All carrier pins are unassigned, so this build only exercises the RTOS task
; set. The default environment is esp32dev_sim.
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32DEV -DHPN_CARRIER_BOARDLESS

; --- Boardless devkit emulating HomeNet Heating control v0.1 (default) ------
; Same MCU, no board: L0 runs the v0.1 logic against the in-memory simulation
; model (outputs, mocked temperatures, mocked pump power, LEDs).
[env:esp32dev_sim]
board = esp32dev
; HPN_BENCH_LOOPBACK is a development aid: L1/L2 pass commands through so the
; portal's Test Mode can drive the emulated board. It is NOT safety
; arbitration and is never enabled in a hardware build.
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32DEV -DHPN_CARRIER_HHN1 -DHPN_IO_EMULATION -DHPN_BENCH_LOOPBACK

; --- Same build, uploaded over the network ---------------------------------
; The firmware accepts an image at POST /api/update (port 80; ?target=fs for
; the LittleFS portal image). No serial link
; or espota listener is needed; any HTTP path to the device works, e.g. a
; reverse proxy or an SSH tunnel to port 80:
;   pio run -e esp32dev_sim_ota -t upload --upload-port <host:port>
; The device reboots into the new image after a successful upload.
[env:esp32dev_sim_ota]
extends = env:esp32dev_sim
upload_protocol = custom
upload_port = localhost:30080
; app:  pio run -e esp32dev_sim_ota -t upload
; portal assets (LittleFS): pio run -e esp32dev_sim_ota -t uploadfs
; Login: HPN_PORTAL_USER / HPN_PORTAL_PASSWORD (default admin / admin).
; The upload is HPN1-signed with the admin login; docs/security.md.
upload_command = "$PYTHONEXE" "$PROJECT_DIR/tools/http_ota.py" "$SOURCE" $UPLOAD_PORT

; --- Boardless devkit emulating HomeNet Heating control v1.x (bench) --------
; Exercises the PCF8574 output byte, the P7 interlock input and the ADS1115
; settings without a physical v1.x board.
[env:esp32dev_hhn1x_sim]
board = esp32dev
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32DEV -DHPN_CARRIER_HHN1X -DHPN_IO_EMULATION -DHPN_BENCH_LOOPBACK

; --- ESP32-S2 in the HomeNet Heating control v0.1 board (LOLIN S2 Mini) -----
; Real hardware, 74HC595 outputs and analogue current MUX.
; Use lolin_s2_pico if the physical board is a PICO instead.
[env:esp32s2]
board = lolin_s2_mini
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32S2 -DHPN_CARRIER_HHN1

; --- Password recovery (flash over USB) -------------------------------------
; Normal firmware that restores the factory passwords (admin/admin,
; monitor/monitor) and removes the MQTT command secret on the first boot of
; the image. Flash with -t upload over USB, log in, set new passwords, then
; upload the normal firmware. See docs/security.md.
[env:esp32s2_password_reset]
extends = env:esp32s2
build_flags = ${env:esp32s2.build_flags} -DHPN_PASSWORD_RESET

[env:esp32dev_sim_password_reset]
extends = env:esp32dev_sim
build_flags = ${env:esp32dev_sim.build_flags} -DHPN_PASSWORD_RESET

; --- ESP32-C3 with HomeNet Heating control v1.x -----------------------------
; Bring-up build on a bare C3 devkit: PCF8574 relay board and optional
; ADS1115/TLV9064 current sensing. The same v1.x profile (and therefore the
; same pins, LEDs and sensors) is used on the C3 and the S3; confirm the pin
; defaults against the schematic before flashing a carrier.
[env:esp32c3_hhn1x]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32C3 -DHPN_CARRIER_HHN1X

; --- ESP32-S3 with HomeNet Heating control v1.x (planned v1.1 board) --------
; The target MCU for the v1.1 carrier: PCF8574 relay board, P7 interlock fault
; input, ADS1115 current front end, DS18B20 on the D3/TEMP net and five TX1812
; LEDs on the D4/LED net. The carrier is still being drawn; the GPIO numbers
; are firmware defaults (docs/boards.md section 3.1) and must be confirmed on
; the final S3 module before flashing a physical unit.
[env:esp32s3_hhn1x]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32S3 -DHPN_CARRIER_HHN1X
