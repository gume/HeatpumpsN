; =============================================================================
; HeatpumpsN controller firmware — PlatformIO project
;
; Default target: classic ESP32 DevKit (esp32dev)
; Additional targets: ESP32-S3, ESP32-S2 (LOLIN S2 Mini), ESP32-C3
;
; Build:   pio run            (from this directory)
; Upload:  pio run -t upload
; Monitor: pio device monitor
; =============================================================================

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs

build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DCORE_DEBUG_LEVEL=3

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  knolleary/PubSubClient@^2.8
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit NeoPixel@^1.12.0

; --- Target: classic ESP32 (default) ----------------------------------------
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32DEV

; --- Target: ESP32-S3 --------------------------------------------------------
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32S3

; --- Target: ESP32-S2 (LOLIN S2 Mini, current physical board) ----------------
; Use lolin_s2_pico if the physical board is a PICO instead.
[env:esp32s2]
board = lolin_s2_mini
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32S2

; --- Target: ESP32-C3 (single-core RISC-V) ----------------------------------
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32C3
