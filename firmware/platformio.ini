; =============================================================================
; HeatpumpsN controller firmware — PlatformIO project
;
; Carriers:
;   HomeNet Heatpumps 1.0   legacy carrier (currently a LOLIN S2 Mini)
;   HomeNet Heatpumps 2.0   next carrier, under planning (ESP32-C3 / ESP32-S3)
;   boardless               bare devkit, no carrier
;
; I/O backend: real pins by default, or the emulation model with
; -DHPN_IO_EMULATION (env esp32dev_sim). See firmware/docs/io-emulation.md.
;
; Build:   pio run            (from this directory)
; Upload:  pio run -t upload
; Monitor: pio device monitor
; =============================================================================

[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs

build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DCORE_DEBUG_LEVEL=3

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  knolleary/PubSubClient@^2.8
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit NeoPixel@^1.12.0

; --- Boardless devkit, real direct GPIO (no carrier fitted) -----------------
; All carrier pins are unassigned, so this build only exercises the RTOS task
; set. Use esp32dev_sim for daily development.
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32DEV -DHPN_CARRIER_BOARDLESS

; --- Boardless devkit emulating HomeNet Heatpumps 1.0 -----------------------
; Same MCU, no carrier: L0 runs the HHN 1.0 logic against the in-memory
; simulation model (outputs, mocked temperatures, mocked pump power, LEDs).
[env:esp32dev_sim]
board = esp32dev
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32DEV -DHPN_CARRIER_HHN1 -DHPN_IO_EMULATION

; --- ESP32-S3 (HomeNet Heatpumps 2.0 primary target, carrier pending) -------
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32S3 -DHPN_CARRIER_BOARDLESS

; --- ESP32-S2 in the HomeNet Heatpumps 1.0 carrier (LOLIN S2 Mini) ----------
; Real hardware, 74HC595 outputs and analogue current MUX.
; Use lolin_s2_pico if the physical board is a PICO instead.
[env:esp32s2]
board = lolin_s2_mini
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32S2 -DHPN_CARRIER_HHN1

; --- ESP32-C3 (HomeNet Heatpumps 2.0 primary target, carrier pending) -------
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32C3 -DHPN_CARRIER_BOARDLESS
