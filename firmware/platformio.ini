; =============================================================================
; HeatpumpsN controller firmware — PlatformIO project
;
; Carriers:
;   HomeNet Heatpumps 1.0   legacy carrier (currently a LOLIN S2 Mini)
;   HomeNet Heatpumps 2.0   next carrier, under planning (ESP32-C3 / ESP32-S3)
;   boardless               bare devkit, no carrier
;
; I/O backend: real pins by default, or the emulation model with
; -DHPN_IO_EMULATION. The default environment esp32dev_sim emulates
; HomeNet Heatpumps 1.0 on a boardless devkit; see firmware/docs/io-emulation.md.
;
; Build:   pio run            (default env: esp32dev_sim)
; Upload:  pio run -t upload
; Monitor: pio device monitor
; =============================================================================

[platformio]
default_envs = esp32dev_sim

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs
; The copy in src/ is what PlatformIO Remote synchronizes. Keep it identical
; to the project-root partitions.csv reference table.
board_build.partitions = src/partitions.csv

build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
  -DCORE_DEBUG_LEVEL=3
  -DHPN_FW_VERSION=\"0.3.0-web\"
  ; AsyncTCP subscribes its service task to the ESP task watchdog by default.
  ; The controller's rule is that only T_io feeds the plant watchdog, so a slow
  ; HTTP handler, a large JSON response or a weak Wi-Fi link can never reset
  ; the outputs. Without this flag a long network callback leaves the shared
  ; watchdog entry stale and the whole controller panics with
  ; "task-watchdog". Keep this in every environment.
  -DCONFIG_ASYNC_TCP_USE_WDT=0

; PlatformIO Remote uploads with the "nobuild" target, which skips the
; platform's checkprogsize/partition parsing and the Arduino framework script.
; The pre/post hooks in src/remote_upload.json (Python SConscript; .json is a
; source extension that PlatformIO Remote syncs) make the partition table
; discoverable and spell out the application offset so esptool accepts the
; call. Extra images (bootloader, partition table, boot_app0) are only added by
; a normal build; a device that was never flashed needs one local upload first.
extra_scripts =
  pre:src/remote_upload.json
  post:src/remote_upload.json

lib_deps =
  bblanchon/ArduinoJson@^7.0.0
  knolleary/PubSubClient@^2.8
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit NeoPixel@^1.12.0
  ESP32Async/AsyncTCP@^3.5.0
  ESP32Async/ESPAsyncWebServer@^3.12.1

; --- Boardless devkit, real direct GPIO (no carrier fitted) -----------------
; All carrier pins are unassigned, so this build only exercises the RTOS task
; set. The default environment is esp32dev_sim.
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32DEV -DHPN_CARRIER_BOARDLESS

; --- Boardless devkit emulating HomeNet Heatpumps 1.0 (default) -------------
; Same MCU, no carrier: L0 runs the HHN 1.0 logic against the in-memory
; simulation model (outputs, mocked temperatures, mocked pump power, LEDs).
[env:esp32dev_sim]
board = esp32dev
; HPN_BENCH_LOOPBACK is a development aid: L1/L2 pass commands through so the
; portal's Test Mode can drive the emulated carrier. It is NOT safety
; arbitration and is never enabled in a hardware build.
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32DEV -DHPN_CARRIER_HHN1 -DHPN_IO_EMULATION -DHPN_BENCH_LOOPBACK

; --- ESP32-S3 (HomeNet Heatpumps 2.0 primary target, carrier pending) -------
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32S3 -DHPN_CARRIER_BOARDLESS

; --- ESP32-S2 in the HomeNet Heatpumps 1.0 carrier (LOLIN S2 Mini) ----------
; Real hardware, 74HC595 outputs and analogue current MUX.
; Use lolin_s2_pico if the physical board is a PICO instead.
[env:esp32s2]
board = lolin_s2_mini
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32S2 -DHPN_CARRIER_HHN1

; --- ESP32-C3 (HomeNet Heatpumps 2.0 primary target, carrier pending) -------
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DHPN_TARGET_ESP32C3 -DHPN_CARRIER_BOARDLESS
