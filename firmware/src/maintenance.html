<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeatpumpsN maintenance</title>
<!-- Built into the firmware (tools/gen_maintenance.py); served at /maintenance
     and in place of the portal while no portal files are installed. -->
<style>
  :root { color-scheme: dark; --bg: #0e1218; --card: #161c25; --line: #2a3340; --text: #e6ebf2; --dim: #8b97a8;
          --accent: #4ea1ff; --ok: #35d07f; --warn: #f5b84c; --err: #ff5c6c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; padding: 16px; }
  main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 18px; margin: 4px 0; } h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
  dt { color: var(--dim); } dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
  input, select, button { font: inherit; color: var(--text); background: #0b0f15; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
  button { cursor: pointer; background: #1f2835; } button.primary { background: var(--accent); color: #04121f; border-color: var(--accent); }
  button.danger { border-color: var(--err); color: var(--err); } button:disabled { opacity: .45; cursor: default; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); } .dim { color: var(--dim); font-size: 12px; }
  #msg { min-height: 1.3em; }
  progress { width: 100%; }
</style>
</head>
<body>
<main>
  <h1>HeatpumpsN maintenance</h1>
  <p class="dim">This page is part of the firmware. It works without the portal files: use it to finish a migration or to restore the portal.</p>

  <section class="card" id="login-card">
    <h2>Log in</h2>
    <form id="login" class="row">
      <select id="user"><option value="admin">admin</option><option value="monitor">monitor</option></select>
      <input id="pass" type="password" placeholder="password" autocomplete="current-password">
      <button class="primary" type="submit">Log in</button>
    </form>
    <div id="msg" class="warn"></div>
  </section>

  <section class="card" id="status-card" hidden>
    <h2>Status</h2>
    <dl id="status"></dl>
    <div id="status-msg" class="warn"></div>
    <div class="row"><button id="logout">Log out</button><a href="/" class="dim">open the full portal</a></div>
  </section>

  <section class="card" id="migrate-card" hidden>
    <h2>1 · Partition layout</h2>
    <p id="migrate-text" class="dim"></p>
    <div class="row"><button class="danger" id="migrate">Migrate partition table and reboot</button></div>
  </section>

  <section class="card" id="upload-card" hidden>
    <h2>2 · Upload</h2>
    <div class="row">
      <select id="target"><option value="fs">Portal files (littlefs.bin)</option><option value="app">Firmware (firmware.bin)</option></select>
      <input id="file" type="file" accept=".bin">
      <button class="primary" id="upload">Upload and reboot</button>
    </div>
    <progress id="progress" value="0" max="100" hidden></progress>
    <div id="upmsg" class="dim"></div>
  </section>

  <section class="card" id="reboot-card" hidden>
    <div class="row"><button id="reboot">Reboot</button></div>
  </section>
</main>
<script src="/maintenance/hpnauth.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '—').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let role = null;

async function call(path, options) {
  const r = await hpnAuth.authFetch(path, options);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

async function refresh() {
  if (!hpnAuth.user) return;
  try {
    // One request at a time: the controller (single-core on the S2) serves them in turn anyway.
    const st = await call('/api/status');
    const lay = await call('/api/system/partitions');
    const live = await call('/api/state');
    const run = lay.running || {};
    const wifi = live.wifi || {};
    const rows = [
      ['Firmware', `${st.version} · ${st.build}`],
      ['Partition layout', lay.layout],
      ['Running slot', `${run.label} at ${run.address} (${run.imageLen} bytes)`],
      ['Image state', run.state + (run.state === 'pending_verify' ? ` · confirmed in ${run.confirmInS} s, rollback in ${run.rollbackInS} s` : '')],
      ['Wi-Fi', wifi.connected ? `${wifi.ssid} · ${wifi.ip}` : `not connected (${wifi.state})`],
      ['Fallback AP', wifi.apActive ? `${wifi.apSsid} · ${wifi.apClients} client(s)` : 'off'],
      ['Logged in', `${hpnAuth.user}${role === 'admin' ? '' : ' (read-only)'}`],
    ];
    $('#status').innerHTML = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
    $('#status-msg').textContent = '';
    const admin = role === 'admin';
    $('#migrate-card').hidden = lay.layout === 'current';
    $('#migrate-text').innerHTML = lay.migrationReady
      ? `This device is on the <b>${esc(lay.layout)}</b> layout. Migrating rewrites the partition table, re-creates the settings and filesystem areas (this firmware's settings are carried over) and reboots. Upload the portal files afterwards.`
      : `This device is on the <b>${esc(lay.layout)}</b> layout. Migration is not possible yet: ${esc(lay.migrationBlocker)}.`;
    $('#migrate').disabled = !admin || !lay.migrationReady;
    $('#upload-card').hidden = !admin;
    $('#reboot-card').hidden = !admin;
  } catch (err) {
    if (err.auth) showLogin(); else $('#status-msg').textContent = `Status not available: ${err.message} (retrying every 5 s)`;
  }
}

function showLogin(text = '') {
  $('#login-card').hidden = false;
  for (const id of ['#status-card', '#migrate-card', '#upload-card', '#reboot-card']) $(id).hidden = true;
  $('#msg').textContent = text;
}

async function afterLogin() {
  const who = await call('/api/session');
  role = who.role;
  $('#login-card').hidden = true;
  $('#status-card').hidden = false;
  await refresh();
}

$('#login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#msg').textContent = 'Checking…';
  try {
    await hpnAuth.login($('#user').value, $('#pass').value);
    await afterLogin();
  } catch (err) {
    $('#msg').textContent = err.message;
  }
});

$('#logout').addEventListener('click', () => { hpnAuth.logout(); showLogin('Logged out.'); });

$('#migrate').addEventListener('click', async () => {
  if (!confirm('Rewrite the partition table and reboot? Do not power off the controller during the next minute.')) return;
  try {
    await call('/api/system/partitions/migrate', { method: 'POST' });
  } catch (err) {
    // The controller reboots before it can answer: a dropped connection is success.
    if (!/fetch|network/i.test(err.message)) { alert(`Migration refused: ${err.message}`); return; }
  }
  $('#migrate-text').textContent = 'Migrating and rebooting… this page reloads in 30 s; log in again.';
  setTimeout(() => location.reload(), 30000);
});

$('#upload').addEventListener('click', async () => {
  const file = $('#file').files[0];
  if (!file) { $('#upmsg').textContent = 'Choose a file first.'; return; }
  if (!confirm(`Upload ${file.name} (${file.size} bytes) and reboot?`)) return;
  $('#upmsg').textContent = 'Hashing…';
  const sha = hpnAuth.toHex(hpnAuth.sha256(new Uint8Array(await file.arrayBuffer())));
  const url = `/api/update?sha256=${sha}${$('#target').value === 'fs' ? '&target=fs' : ''}`;
  const form = new FormData();
  form.append('firmware', file, file.name);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', url);
  xhr.setRequestHeader('X-HPN-Auth', await hpnAuth.uploadAuth(url));
  $('#progress').hidden = false;
  xhr.upload.onprogress = (ev) => { if (ev.lengthComputable) $('#progress').value = (ev.loaded / ev.total) * 100; };
  xhr.onload = () => {
    hpnAuth.takeNonce({ headers: { get: (h) => xhr.getResponseHeader(h) } });
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch (err) { /* keep empty */ }
    if (xhr.status === 200 && data.ok) {
      $('#upmsg').textContent = 'Accepted. The controller reboots; this page reloads in 30 s.';
      setTimeout(() => location.reload(), 30000);
    } else {
      $('#upmsg').textContent = `Upload failed: ${data.error || `HTTP ${xhr.status}`}`;
    }
  };
  xhr.onerror = () => { $('#upmsg').textContent = 'Upload failed: connection error.'; };
  $('#upmsg').textContent = 'Uploading…';
  xhr.send(form);
});

$('#reboot').addEventListener('click', async () => {
  if (!confirm('Reboot the controller?')) return;
  try { await call('/api/system/reboot', { method: 'POST' }); } catch (err) { /* reboots */ }
  $('#upmsg').textContent = 'Rebooting… this page reloads in 20 s.';
  setTimeout(() => location.reload(), 20000);
});

if (hpnAuth.user) afterLogin().catch(() => showLogin()); else showLogin();
setInterval(refresh, 5000);
</script>
</body>
</html>
